<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Каталог книг с загрузкой и добавлением записей через REST API"
    />
    <title>Каталог книг</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./styles.css" />
    <script src="./script.js" defer></script>
  </head>

  <body>
    <header class="page-header">
      <div class="page-header__content">
        <p class="page-header__eyebrow">HTTP и API</p>
        <h1 class="page-header__title">Каталог книг</h1>
        <p class="page-header__lead">
          Просматривайте книги и добавляйте новые в каталог.
        </p>
      </div>
    </header>

    <main class="workspace">
      <section class="panel panel--collection" aria-labelledby="collection-title">
        <div class="panel__header">
          <div>
            <p class="panel__eyebrow">Коллекция</p>
            <h2 class="panel__title" id="collection-title">Книги</h2>
          </div>

          <button class="button button--secondary" type="button" data-action="reload">
            Обновить
          </button>
        </div>

        <p class="endpoint">
          Endpoint:
          <code class="endpoint__value" data-ui="endpoint"></code>
        </p>

        <div class="field">
          <label class="field__label" for="book-search">Поиск по названию</label>
          <input class="field__control" id="book-search" type="search" placeholder="Введите название книги" />
        </div>

        <div class="status" data-ui="status" role="status" aria-live="polite">
          <strong class="status__title">Ожидание загрузки</strong>
          <span class="status__text">
            Здесь появится результат загрузки каталога.
          </span>
        </div>

        <div class="collection" data-ui="collection" hidden></div>
      </section>

      <section class="panel panel--form" aria-labelledby="form-title">
        <div class="panel__header">
          <div>
            <p class="panel__eyebrow">Новая книга</p>
            <h2 class="panel__title" id="form-title">Добавить книгу</h2>
          </div>
        </div>

        <form class="entry-form" data-form="entry">
          <div class="field">
            <label class="field__label" for="entry-title">Название книги</label>
            <input class="field__control" id="entry-title" name="title" type="text" minlength="1" maxlength="150" placeholder="Например, Мастер и Маргарита" required />
          </div>

          <div class="field">
            <label class="field__label" for="entry-author">Автор</label>
            <input class="field__control" id="entry-author" name="author" type="text" minlength="2" maxlength="100" placeholder="Например, Михаил Булгаков" required />
          </div>

          <div class="field">
            <label class="field__label" for="entry-genre">Жанр</label>
            <select class="field__control" id="entry-genre" name="genre" required>
              <option value="">Выберите жанр</option>
              <option value="Роман">Роман</option>
              <option value="Повесть">Повесть</option>
              <option value="Рассказ">Рассказ</option>
              <option value="Поэзия">Поэзия</option>
              <option value="Другое">Другое</option>
            </select>
          </div>

          <div class="field">
            <label class="field__label" for="entry-year">Год издания</label>
            <input class="field__control" id="entry-year" name="year" type="number" min="1" max="2026" step="1" placeholder="Например, 1967" required />
          </div>

          <p class="entry-form__hint">Все четыре поля обязательны.</p>

          <p class="entry-form__status" data-ui="submit-status" role="status" aria-live="polite"></p>

          <div class="entry-form__actions">
            <button class="button button--primary" type="submit" data-action="submit">
              Добавить книгу
            </button>
            <button class="button button--secondary" type="button" data-action="cancel-edit" hidden>
              Отменить редактирование
            </button>
          </div>
        </form>
      </section>
    </main>

    <footer class="page-footer">
      <p class="page-footer__text">
        Каталог книг
      </p>
    </footer>
  </body>
</html>
